name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy per volta: se ne parte un altro, il precedente si annulla.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nessun `version:` qui: package.json ha gia "packageManager": "pnpm@10.4.1",
      # e indicarla in due posti fa fallire l'action con ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        # PUBLIC_DEPLOY attiva base=/dolceyo/ e disattiva i plugin di sviluppo Manus
        env:
          PUBLIC_DEPLOY: "1"
        run: pnpm exec vite build

      # enablement: true attiva Pages e ne imposta la sorgente su GitHub Actions
      # via API, usando il permesso `pages: write`. Senza questo, se Pages risulta
      # disattivato il passo finale deploy-pages fallisce con "Not Found".
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
